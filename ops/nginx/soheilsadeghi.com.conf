# /etc/nginx/sites-available/soheilsadeghi.com  (symlinked into sites-enabled)
upstream soheil_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# HTTP → HTTPS (the ACME challenge path stays reachable for certificate renewals)
server {
    listen 80;
    listen [::]:80;
    server_name soheilsadeghi.com www.soheilsadeghi.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://soheilsadeghi.com$request_uri;
    }
}

# www → apex
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.soheilsadeghi.com;
    include snippets/soheil-tls.conf;
    return 301 https://soheilsadeghi.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name soheilsadeghi.com;
    include snippets/soheil-tls.conf;

    server_tokens off;
    client_max_body_size 1024m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        include snippets/soheil-proxy.conf;
    }
}
